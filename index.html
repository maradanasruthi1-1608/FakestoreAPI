<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card {
            border: 2px solid black;
            width: 290px;
            height: 360px;
            border-radius: 10px;
            margin: 10px;
            text-align: center;
            box-shadow: 4px 5px 15px gray;
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
        }
        .main {
            display: flex;
            flex-wrap: wrap;
            margin: auto;
        }
        .card button {
            width: 48%;
            padding: 10px;
            background-color: rgb(1, 145, 59);
            color: white;
            border: none;
            border-radius: 4px;
        }
        .card:hover {
            cursor: pointer;
            box-shadow: 4px 5px 20px rgb(230, 0, 0);
        }
    </style>
</head>
<body>
    <nav>
        <div class="input-search">
            <input type="text" id="search" placeholder="Search...">
            <button onclick="searchProducts()">Search</button>
        </div>
    </nav>
    <main>
        <div id="container" class="main"></div>
    </main>
    <script>
            let allProducts = [];
        async function getApiData() {
        let data = await fetch("https://fakestoreapi.com/products");
        let apiData = await data.json();
        allProducts = apiData;
        displayProducts(allProducts);
    }
        function displayProducts(products) {
        document.getElementById("container").innerHTML = "";
        products.map((item) => {
        document.getElementById("container").innerHTML += `
            <div class="card">
                <img src="${item.image}" alt=""><br>
                <b>BRAND NAME:</b> ${item.title}<br>
                <b>PRICE:</b> ${item.price} $<br>
                <b>RATING:</b> ${item.rating.rate}<br>
                <button>READ ME</button>
                <button>WISH LIST</button>
            </div>
            `;
        });
    }
        function searchProducts() {
            let searchValue = document.getElementById("search").value.toLowerCase().trim();
            let filteredData = allProducts.filter((item) => {
            let category = item.category.toLowerCase().replace(/'/g, "");
            let search = searchValue.replace(/'/g, "");
            return category.includes(search) ||
               item.title.toLowerCase().includes(search);
            });
        displayProducts(filteredData);
    }
        getApiData();
    </script>
</body>
</html>
